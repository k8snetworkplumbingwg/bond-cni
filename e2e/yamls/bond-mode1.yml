---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: bond-net
spec:
  config: |
    {
      "cniVersion": "1.1.0",
      "type": "bond",
      "ifname": "bond0",
      "mode": "active-backup",
      "miimon": "100",
      "mtu": 1300,
      "linksInContainer": true,
      "links": [
        {"name": "net1"},
        {"name": "net2"}
      ]
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: bond-test
  labels:
    app: bond-test
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [
        {"name": "slave-one", "interface": "net1"},
        {"name": "slave-two", "interface": "net2"},
        {"name": "bond-net",  "interface": "bond0"}
      ]
spec:
  containers:
  - name: bond-test
    image: docker.io/library/alpine:3.19
    command: ["sleep", "infinity"]
